[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-planner"
version = "0.1.0"
description = "A Streamlit-based course planning app built around historical schedule data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Melih" }]
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "matplotlib>=3.10,<4",
    "pandas>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "pyscipopt>=5.2,<6",
    "streamlit>=1.41,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.17,<0.18"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"course_planner.ingestion" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
