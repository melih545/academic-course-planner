[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-planner"
version = "0.1.0"
description = "A Streamlit-based course planning app built around historical schedule data."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Melih" }]
dependencies = [
    "matplotlib>=3.10,<4",
    "pandas>=2.2,<3",
    "pyscipopt>=5.2,<6",
    "streamlit>=1.41,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
