name: course-planner-ingestion

x-database-env: &database-env
  PGHOST: db
  PGUSER: course_planner
  PGPASSWORD: course_planner
  PGDATABASE: course_planner

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: course_planner
      POSTGRES_PASSWORD: course_planner
      POSTGRES_DB: course_planner
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "course_planner", "-d", "course_planner"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - db_data:/var/lib/postgresql

  ingest:
    profiles: [tools]
    build:
      context: .
      target: ingest
    environment: *database-env
    depends_on:
      db:
        condition: service_healthy

  db-test:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      <<: *database-env
      COURSE_PLANNER_TEST_DSN: postgresql://course_planner:course_planner@db/course_planner
      COURSE_PLANNER_TEST_AMQP_URL: amqp://course_planner:course_planner@rabbitmq:5672/%2F
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.2
    environment:
      RABBITMQ_DEFAULT_USER: course_planner
      RABBITMQ_DEFAULT_PASS: course_planner
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  worker:
    build:
      context: .
      target: worker
    environment:
      <<: *database-env
      COURSE_PLANNER_AMQP_URL: amqp://course_planner:course_planner@rabbitmq:5672/%2F
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment: *database-env
    ports: ["127.0.0.1:${COURSE_PLANNER_API_PORT:-8000}:8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10

  ui:
    build:
      context: .
      target: ui
    environment:
      COURSE_PLANNER_API_URL: http://api:8000
    ports: ["127.0.0.1:${COURSE_PLANNER_UI_PORT:-8501}:8501"]
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    profiles: [monitoring]
    build:
      context: .
      target: prometheus
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy

  grafana:
    profiles: [monitoring]
    build:
      context: .
      target: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${COURSE_PLANNER_GRAFANA_PASSWORD:-course_planner}
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  db_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
